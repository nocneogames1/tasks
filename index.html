<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Firebase List Manager</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  <style>
    #listsContainer {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      margin-top: 20px;
      width: 100%;
    }
  
    .list-card {
      flex: 1 1 300px;
      max-width: 100%;
    }
  
    .collection-item {
    font-size: 2rem;
      padding: 20px 30px;
      font-weight: 700;
    }
  
    .collection-item strong {
      font-size: 2rem;
      font-weight: 700;
    }
  
    .collection-item span {
      font-size: 1.2rem;
    }
  
    .item-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
  </style>
</head>
<body class="grey lighten-4">
  <div class="container">
    <div class="card">
      <div class="card-content">
        <span class="card-title">Create a New List</span>
        <div class="input-field">
          <input type="text" id="listTitle" />
          <label for="listTitle">List Title</label>
        </div>
        <button class="btn blue" onclick="createList()">Add List</button>
      </div>
    </div>
    <div id="listsContainer"></div>
  </div>

  <!-- Materialize JS and jQuery -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>

  <!-- Firebase Integration -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
    import {
      getFirestore,
      collection,
      addDoc,
      updateDoc,
      arrayUnion,
      arrayRemove,
      deleteDoc,
      onSnapshot,
      doc
    } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBNv4_A_a9VDsJZeOUWMKwOUnpGOokUlFs",
      authDomain: "tasks-8e65a.firebaseapp.com",
      projectId: "tasks-8e65a",
      storageBucket: "tasks-8e65a.appspot.com",
      messagingSenderId: "597818811041",
      appId: "1:597818811041:web:93720931d864b3ea9706e0",
      measurementId: "G-CYE13L85HF"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const listsCol = collection(db, "lists");

    onSnapshot(listsCol, (snapshot) => {
      document.getElementById("listsContainer").innerHTML = "";
      snapshot.forEach(docSnap => {
        renderList(docSnap.id, docSnap.data());
      });
    });

    window.createList = async function () {
      const titleInput = document.getElementById("listTitle");
      const title = titleInput.value.trim();
      if (!title) return M.toast({ html: "Please enter a list title" });
      await addDoc(listsCol, {
        title: title,
        items: []
      });
      titleInput.value = "";
    };

    window.addItem = async function (listId) {
      const inputId = `${listId}-itemTitle`;
      const itemInput = document.getElementById(inputId);
      const itemTitle = itemInput.value.trim();
      if (!itemTitle) return M.toast({ html: "Please enter an item title" });
      const time = new Date().toLocaleString();
      const listRef = doc(db, "lists", listId);
      await updateDoc(listRef, {
        items: arrayUnion({ title: itemTitle, time })
      });
      itemInput.value = "";
    };

    window.deleteList = async function (listId) {
      if (confirm("Are you sure you want to delete this list?")) {
        await deleteDoc(doc(db, "lists", listId));
      }
    };

    window.deleteItem = async function (listId, item) {
      const listRef = doc(db, "lists", listId);
      await updateDoc(listRef, {
        items: arrayRemove(item)
      });
    };

    // Helper to determine color based on how old the timestamp is
    function getTimeColor(timeStr) {
      const itemDate = new Date(timeStr);
      const now = new Date();
      const diffMs = now - itemDate;
      const diffHours = diffMs / (1000 * 60 * 60);
      if (diffHours < 2) return "green-text";
      if (diffHours < 10) return "orange-text";
      return "red-text";
    }

    window.renderList = function (id, data) {
      const itemsHTML = (data.items || []).map(item => `
        <li class="collection-item">
          <div class="item-row">
            <div>
              <strong>${item.title}</strong><br>
              <span class="${getTimeColor(item.time)}">${item.time}</span>
            </div>
            <a href="#!" onclick='deleteItem("${id}", ${JSON.stringify(item)})'>
              <i class="material-icons red-text">delete</i>
            </a>
          </div>
        </li>`).join("");

      const listHTML = `
        <div class="list-card" id="${id}">
          <div class="card">
            <div class="card-content">
              <div class="card-title" style="display: flex; justify-content: space-between; align-items: center;">
                ${data.title}
                <a href="#!" class="red-text" onclick="deleteList('${id}')">
                  <i class="material-icons">delete</i>
                </a>
              </div>
              <ul class="collection" id="${id}-items">${itemsHTML}</ul>
              <div class="input-field">
                <input type="text" id="${id}-itemTitle">
                <label for="${id}-itemTitle">Item Title</label>
              </div>
              <button class="btn green" onclick="addItem('${id}')">Add Item</button>
            </div>
          </div>
        </div>
      `;
      document.getElementById("listsContainer").insertAdjacentHTML("beforeend", listHTML);
    };
  </script>
</body>
</html>
