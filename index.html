<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Firebase List Manager</title>

  <!-- prevent favicon 404 -->
  <link rel="icon" href="data:,">

  <link href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />

  <style>
    html, body { height: 100%; margin: 0; }

    .container {
      max-width: 90%;
      width: 100%;
      padding: 0;
      margin-top: 10px;
    }

    #listsContainer {
      display: flex;
      flex-wrap: nowrap;
      gap: 16px;
      margin-top: 20px;
      min-height: 50vh;
      overflow-x: auto;
    }

    .list-card { flex: 1 1 auto; height: auto; }

    .list-card .card {
      height: 100%;
      margin: 0;
      border-radius: 0;
      box-shadow: none;
    }

    .item-actions {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 2px;
      flex-wrap: nowrap;
    }
    .item-actions .chip { white-space: nowrap; }

    .status-select {
      font-size: 0;
      width: 20px;
      height: 20px;
      padding: 0;
      border: none;
      background-color: transparent;
      -webkit-appearance: menulist;
    }
    .status-select option { font-size: 0.85rem; }

    /* Status chip colors */
    .chip.status-pending   { background-color: #9e9e9e; color: #fff; }
    .chip.status-inprogress{ background-color: #2196f3; color: #fff; }
    .chip.status-done      { background-color: #43a047; color: #fff; }
    .chip.status-blocked   { background-color: #e53935; color: #fff; }
  </style>
</head>
<body class="grey lighten-4">
  <div class="container">
    <div class="center-align toggle-btn">
      <button class="btn grey" onclick="toggleCreateList()">Toggle List Creator</button>
    </div>

    <div class="card" id="createListCard" style="display: none;">
      <div class="card-content">
        <span class="card-title">Create a New List</span>
        <div class="input-field">
          <input type="text" id="listTitle" />
          <label for="listTitle">List Title</label>
        </div>
        <button class="btn blue" onclick="createList()">Add List</button>
      </div>
    </div>

    <!-- fixed: removed stray 'srt' -->
    <div id="listsContainer"></div>
  </div>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";
    import {
      getFirestore, collection, addDoc, updateDoc, arrayUnion, arrayRemove,
      deleteDoc, onSnapshot, doc, query, where
    } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";
  
    const firebaseConfig = {
      apiKey: "AIzaSyBNv4_A_a9VDsJZeOUWMKwOUnpGOokUlFs",
      authDomain: "tasks-8e65a.firebaseapp.com",
      projectId: "tasks-8e65a",
      storageBucket: "tasks-8e65a.appspot.com",
      messagingSenderId: "597818811041",
      appId: "1:597818811041:web:93720931d864b3ea9706e0",
      measurementId: "G-CYE13L85HF"
    };
  
    const app  = initializeApp(firebaseConfig);
    const auth = getAuth(app);
  
    // 1) Sign in (Anonymous is fine for dev)
    signInAnonymously(auth).catch(e => {
      console.error("Auth error:", e);
      window.M?.toast && M.toast({ html: e.code || e.message });
    });
  
    onAuthStateChanged(auth, (user) => {
      if (!user) return;
  
      const db = getFirestore(app);
      const listsCol = collection(db, "lists");
  
      // 2) LISTEN ONLY TO MY DOCS
      const myListsQ = query(listsCol, where("ownerId", "==", user.uid));
  
      onSnapshot(myListsQ, (snapshot) => {
        const container = document.getElementById("listsContainer");
        container.innerHTML = "";
        snapshot.forEach(docSnap => renderList(docSnap.id, docSnap.data()));
      }, (err) => {
        console.error("onSnapshot error:", err);
        window.M?.toast && M.toast({ html: "Firestore: " + (err.code || err.message) });
      });
  
      // 3) CREATE LIST — include ownerId so rules allow it
      window.createList = async function () {
        const titleInput = document.getElementById("listTitle");
        const title = titleInput.value.trim();
        if (!title) return M.toast({ html: "Please enter a list title" });
        await addDoc(listsCol, { title, items: [], ownerId: user.uid });
        titleInput.value = "";
      };
  
      window.addItem = async function (listId) {
        const inputId = `${listId}-itemTitle`;
        const itemInput = document.getElementById(inputId);
        const itemTitle = itemInput.value.trim();
        if (!itemTitle) return M.toast({ html: "Please enter an item title" });
  
        const time = Date.now();
        const status = "Pending";
        await updateDoc(doc(db, "lists", listId), {
          items: arrayUnion({ title: itemTitle, time, status })
        });
        itemInput.value = "";
      };
  
      window.deleteList = async function (listId) {
        if (!confirm("Are you sure you want to delete this list?")) return;
        await deleteDoc(doc(db, "lists", listId));
      };
  
      window.deleteItem = async function (listId, item) {
        await updateDoc(doc(db, "lists", listId), { items: arrayRemove(item) });
      };
  
      window.editItem = async function (listId, item) {
        const newTitleRaw = prompt("Edit item title:", item.title);
        if (newTitleRaw === null) return;
        const newTitle = newTitleRaw.trim();
        if (!newTitle) return M.toast({ html: "Title cannot be empty" });
        if (newTitle === item.title) return;
  
        const listRef = doc(db, "lists", listId);
        await updateDoc(listRef, { items: arrayRemove(item) });
        await updateDoc(listRef, {
          items: arrayUnion({ title: newTitle, time: item.time, status: item.status || "Pending" })
        });
        M.toast({ html: "Item updated" });
      };
  
      window.changeStatus = async function (listId, item, newStatus) {
        const listRef = doc(db, "lists", listId);
        await updateDoc(listRef, { items: arrayRemove(item) });
        await updateDoc(listRef, {
          items: arrayUnion({ title: item.title, time: item.time, status: newStatus })
        });
        M.toast({ html: "Status updated" });
      };
  
      function getStatusChipClass(status) {
        const s = (status || "Pending").toLowerCase();
        if (s === "done") return "status-done";
        if (s.includes("progress")) return "status-inprogress";
        if (s === "blocked") return "status-blocked";
        return "status-pending";
      }
  
      function getTimeColor(timeVal) {
        const d = typeof timeVal === "number" ? new Date(timeVal) : new Date(timeVal);
        const diffHours = (Date.now() - d.getTime()) / 36e5;
        if (diffHours < 2) return "green-text";
        if (diffHours < 10) return "orange-text";
        return "red-text";
      }
  
      window.renderList = function (id, data) {
        const itemsHTML = (data.items || []).map(item => `
          <li class="collection-item">
            <div class="item-column" style="display:flex;justify-content:space-between;align-items:center;gap:12px;">
              <div>
                <strong style="font-size:30px">${item.title}</strong><br>
                <span class="${getTimeColor(item.time)}">${new Date(item.time || Date.now()).toLocaleString()}</span>
              </div>
              <div class="item-actions">
                <span class="chip ${getStatusChipClass(item.status)}">${item.status || 'Pending'}</span>
                <select class="status-select browser-default" onchange='changeStatus("${id}", ${JSON.stringify(item)}, this.value)'>
                  <option value="Pending" ${item.status === "Pending" ? "selected" : ""}>Pending</option>
                  <option value="In Progress" ${item.status === "In Progress" ? "selected" : ""}>In Progress</option>
                  <option value="Done" ${item.status === "Done" ? "selected" : ""}>Done</option>
                  <option value="Blocked" ${item.status === "Blocked" ? "selected" : ""}>Blocked</option>
                </select>
                <a href="#!" onclick='editItem("${id}", ${JSON.stringify(item)})' title="Edit">
                  <i class="material-icons">edit</i>
                </a>
                <a href="#!" onclick='deleteItem("${id}", ${JSON.stringify(item)})' title="Delete">
                  <i class="material-icons red-text">delete</i>
                </a>
              </div>
            </div>
          </li>`).join("");
  
        const listHTML = `
          <div class="list-card" id="${id}">
            <div class="card">
              <div class="card-content">
                <div class="card-title" style="display:flex;justify-content:center;align-items:flex-start;gap:8px;">
                  ${data.title}
                  <a href="#!" class="red-text" onclick="deleteList('${id}')" title="Delete List">
                    <i class="material-icons">delete</i>
                  </a>
                </div>
                <ul class="collection" id="${id}-items">${itemsHTML}</ul>
                <div class="input-field">
                  <input type="text" id="${id}-itemTitle">
                  <label for="${id}-itemTitle">Item Title</label>
                </div>
                <button class="btn green" onclick="addItem('${id}')">Add Item</button>
              </div>
            </div>
          </div>`;
        document.getElementById("listsContainer").insertAdjacentHTML("beforeend", listHTML);
      };
  
      window.toggleCreateList = function () {
        const card = document.getElementById("createListCard");
        card.style.display = card.style.display === "none" ? "block" : "none";
      };
    });
  </script>
  
  
</body>
</html>
